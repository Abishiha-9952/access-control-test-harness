openapi: 3.0.3

info:
  title: Test API
  version: 1.0.0

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []

paths:
  /api/users:
    get:
      summary: List users
      security:
        - bearerAuth: []

    post:
      summary: Create user
      security:
        - bearerAuth: []

  /api/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer

    get:
      summary: Get user
      security:
        - bearerAuth: []

    put:
      summary: Update user
      security:
        - bearerAuth: []

    delete:
      summary: Delete user
      security:
        - bearerAuth: []

  /api/products:
    get:
      summary: List products
      security:
        - bearerAuth: []
