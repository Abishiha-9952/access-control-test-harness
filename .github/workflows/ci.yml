name: CI

on:
  push:
    branches:
      - main
      - feature/policy-test-generation
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python files
        run: python -m compileall harness

      - name: Run policy and test generator smoke test
        run: |
          python - <<'PY'
          from harness.inference.policy_inference import infer_policy
          from harness.generator.test_generator import generate_tests

          endpoints = [
              {"method": "GET", "path": "/users"},
              {"method": "GET", "path": "/admin/users"}
          ]

          actors = [
              {"role": "admin"},
              {"role": "user"}
          ]

          policy = infer_policy(endpoints, actors)
          tests = generate_tests(endpoints, policy)

          assert policy
          assert tests

          print("Policy inference and test generation passed.")
          PY
