roles:
  guest:
    GET /:
      access: allow

    POST /api/login:
      access: allow

    GET /api/products:
      access: allow

  user:
    GET /:
      access: allow

    POST /api/login:
      access: allow

    GET /api/products:
      access: allow

    GET /api/me:
      access: allow

    GET /api/users/{id}:
      access: any

    GET /api/orders/{id}:
      access: own

    GET /api/admin/users:
      access: deny

    DELETE /api/admin/users/{id}:
      access: deny

    GET /api/admin/stats:
      access: deny

    PATCH /api/users/{id}:
      access: own

  admin:
    GET /:
      access: allow

    POST /api/login:
      access: allow

    GET /api/products:
      access: allow

    GET /api/me:
      access: allow

    GET /api/users/{id}:
      access: any

    GET /api/orders/{id}:
      access: any

    GET /api/admin/users:
      access: allow

    DELETE /api/admin/users/{id}:
      access: allow

    GET /api/admin/stats:
      access: allow

    PATCH /api/users/{id}:
      access: any
