openapi: 3.0.3

info:
  title: Access Control Test Harness API
  version: 1.0.0
  description: Local API used for access-control testing

servers:
  - url: http://127.0.0.1:5000

paths:

  /:
    get:
      summary: Health check
      responses:
        "200":
          description: Server is running

  /api/login:
    post:
      summary: Login and obtain JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Login successful
        "401":
          description: Invalid credentials

  /api/products:
    get:
      summary: View products
      responses:
        "200":
          description: Product list

  /api/me:
    get:
      summary: View current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user information
        "401":
          description: Authentication required

  /api/users/{id}:
    get:
      summary: View user profile
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User profile
        "403":
          description: Access denied
        "404":
          description: User not found

    patch:
      summary: Update user profile
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                email:
                  type: string
      responses:
        "200":
          description: Profile updated
        "403":
          description: Access denied
        "404":
          description: User not found

  /api/orders/{id}:
    get:
      summary: View order
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order information
        "403":
          description: Access denied
        "404":
          description: Order not found

  /api/admin/users:
    get:
      summary: View all users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of all users
        "403":
          description: Admin access required

  /api/admin/users/{id}:
    delete:
      summary: Delete a user
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User deleted
        "400":
          description: Cannot delete admin
        "403":
          description: Admin access required
        "404":
          description: User not found

  /api/admin/stats:
    get:
      summary: View system statistics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: System statistics
        "403":
          description: Admin access required

components:
  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
